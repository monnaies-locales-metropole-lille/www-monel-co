# www.monel.co — nginx vhost
#
# TLS is expected to terminate upstream (reverse proxy / load balancer). This
# server block speaks plain HTTP on the internal network only.
#
# A note on matching order, because it is load-bearing here: nginx picks the
# longest prefix match, and if that prefix is marked `^~` it stops without
# considering regex locations at all. IMG/ and local/ are therefore declared `^~`
# so that no request under them can ever reach the `\.php$` handler, whatever else
# is in this file. Dangerous extensions are then 404'd by a nested regex inside
# each block. Two independent reasons a dropped shell cannot execute.

upstream spip_php {
    server php:9000;
    keepalive 8;
}

server {
    listen      8080;
    server_name www.monel.co monel.co;

    root  /var/www/spip;
    index index.php;

    client_max_body_size 10m;

    # ---------------------------------------------------------------------
    # Baseline headers
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ---------------------------------------------------------------------
    # Reject the exploit's encoding-bypass header
    # ---------------------------------------------------------------------
    # CVE-2026-77806 was triggered with `X-Spip-Filtre: html_entity_decode` on the
    # request. 4.4.21 fixes it properly; this is an independent backstop that costs
    # nothing, because SPIP only ever *sets* this header on responses and never
    # reads it from a request. Rejecting is better than stripping: it is visible in
    # the access log, so a scanning wave shows up as 400s instead of silence.
    if ($http_x_spip_filtre) {
        return 400;
    }

    # ---------------------------------------------------------------------
    # Hard denials
    # ---------------------------------------------------------------------

    # Secrets, build metadata, dotfiles. connect.php and cles.php live outside the
    # webroot entirely, but config/ is denied regardless.
    location ~ ^/(config|ecrire/data)/ { return 404; }
    location ~ /\.                     { return 404; }
    location ~* ^/(composer\.(json|lock|phar)|package(-lock)?\.json|phpcs\.xml.*)$ { return 404; }

    # The installer and loader are deleted at build time; deny them anyway so a
    # botched image can never expose them.
    location ~* ^/(spip_loader\.php|spip_loader_list\.json|ecrire/install/) { return 404; }

    # This server executes PHP through php-fpm and nothing else. No CGI, ever.
    # The ALFA channel on /var/www/mlml.fr registered `.alfa` as a CGI handler via a
    # dropped .htaccess — nginx ignores .htaccess entirely, which is a genuine
    # advantage over the Apache setup, but be explicit about it.
    location ~* \.(alfa|cgi|pl|py|sh|lua)$ { return 404; }

    # ---------------------------------------------------------------------
    # Writable volumes — inert by construction
    # ---------------------------------------------------------------------
    # These are the only two writable directories inside the webroot. `^~` keeps the
    # PHP handler out; the nested regex refuses to serve executable-looking files at
    # all, so a dropped shell is neither run nor disclosed as source.
    #
    # tmp/ is absent from this file because it is not under the webroot — see
    # _DIR_TMP in config/mes_options.php. The directory the 2026-08-21 payload
    # executed from is not addressable by URL.
    location ^~ /IMG/ {
        location ~* \.(php|php[0-9]|phtml|phar|phps|inc|alfa|cgi|pl|py|sh)$ { return 404; }

        # Uploaded documents are served inert. Mirrors the `Content-Security-Policy:
        # sandbox` rule in SPIP's own htaccess.txt, which stops an uploaded SVG or
        # HTML file from running script in the site's origin.
        add_header Content-Security-Policy "sandbox"   always;
        add_header X-Content-Type-Options  "nosniff"   always;
        add_header X-Frame-Options         "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location ^~ /local/ {
        location ~* \.(php|php[0-9]|phtml|phar|phps|inc|alfa|cgi|pl|py|sh)$ { return 404; }

        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # SPIP routing
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /spip.php?$query_string;
    }

    location = /favicon.ico { try_files $uri /spip.php?page=favicon.ico; access_log off; }
    location = /robots.txt  { try_files $uri /spip.php?page=robots.txt;  access_log off; }
    location = /sitemap.xml { try_files $uri /spip.php?page=sitemap.xml; }

    # ---------------------------------------------------------------------
    # Private area
    # ---------------------------------------------------------------------
    # /ecrire/ is the back office. Four accounts use it. Restricting it to known
    # networks removes the whole authenticated attack surface from the internet.
    # Uncomment and set real ranges — see README §Before first deploy.
    #
    # location ^~ /ecrire/ {
    #     allow 192.0.2.0/24;   # office
    #     deny  all;
    #     location ~ \.php$ {
    #         try_files $uri =404;
    #         fastcgi_split_path_info ^(.+\.php)(/.+)$;
    #         fastcgi_pass  spip_php;
    #         include       fastcgi_params;
    #         fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #         fastcgi_param PATH_INFO       $fastcgi_path_info;
    #         fastcgi_param HTTPS           $http_x_forwarded_proto if_not_empty;
    #     }
    #     try_files $uri $uri/ /ecrire/index.php?$query_string;
    # }

    # ---------------------------------------------------------------------
    # PHP
    # ---------------------------------------------------------------------
    location ~ \.php$ {
        # Refuse to hand anything to php-fpm unless the script really exists.
        # Without this, path-info tricks (/uploaded.jpg/x.php) reach the interpreter.
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass  spip_php;
        fastcgi_index index.php;

        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $http_x_forwarded_proto if_not_empty;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------
    # Detection was incidental last time, and Apache logs only went back 14 days.
    # Request bodies are still not captured, but query strings, referrer, UA and
    # upstream timing are. Ship these somewhere with 90-day retention.
    access_log /dev/stdout spip_combined;
    error_log  /dev/stderr warn;
}
