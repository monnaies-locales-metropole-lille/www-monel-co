# http-context settings. Included before monel.conf (conf.d is included
# alphabetically), which is why log_format lives here rather than in the server
# block — log_format is only valid at http level.

log_format spip_combined '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time urt=$upstream_response_time';

server_tokens off;

# Bodies are buffered to disk above this size; keep it generous enough for
# document uploads without letting a client hold a worker open.
client_body_buffer_size 128k;
client_body_timeout     30s;
client_header_timeout   30s;
send_timeout            30s;

# Trust the upstream proxy for the client address. Set the real proxy range here
# before deploying, otherwise every log line and every rate limit sees the proxy.
# set_real_ip_from 10.0.0.0/8;
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;
