# www.monel.co — the only vhost in this container.
#
# TLS terminates in the host's Apache, which reverse-proxies here. This server
# speaks plain HTTP on 8080, published to 127.0.0.1 only.
#
# The security model in one line: the webroot is read-only, so `AllowOverride All`
# there is safe and picks up SPIP's own maintained rules; the two writable
# directories get `AllowOverride None` plus `php_admin_flag engine off`, which
# nothing an attacker drops can override.

<VirtualHost *:8080>
    DocumentRoot /var/www/spip
    DirectoryIndex index.php index.html

    # The real hostname is whatever the front proxy sends; SPIP reads it from the
    # Host header, and UseCanonicalName Off keeps Apache from rewriting it.
    ServerName monel.local
    UseCanonicalName Off

    ErrorLog  /proc/self/fd/2
    # %a rather than %h: with mod_remoteip, %a is the client address recovered
    # from X-Forwarded-For. The stock `combined` format would log the proxy.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
    CustomLog /proc/self/fd/1 proxied

    # -----------------------------------------------------------------------
    # The webroot
    # -----------------------------------------------------------------------
    # AllowOverride All is safe here *because the directory is read-only*: the
    # only .htaccess that can exist is the one baked into the image, which is
    # SPIP's own htaccess.txt. That gives us the vendor's rules — the local/ and
    # IMG/ PHP deny, the dotfile 404, the IMG sandbox CSP — maintained upstream
    # and tracking SPIP releases, rather than hand-ported equivalents we own.
    #
    # If the webroot ever stops being read-only, this line becomes a hole.
    <Directory /var/www/spip>
        Options -Indexes -Includes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # -----------------------------------------------------------------------
    # The writable volumes — inert by construction
    # -----------------------------------------------------------------------
    # IMG/ and local/ are the only directories an attacker can write to. Three
    # independent reasons a dropped shell cannot execute:
    #
    #   1. php_admin_flag engine off — php_admin_* cannot be overridden, including
    #      by a dropped .htaccess. This is the primitive nginx has no equivalent of.
    #   2. AllowOverride None — nothing dropped here is read as configuration at
    #      all. The ALFA channel on /var/www/mlml.fr worked by dropping an
    #      .htaccess with `AddHandler cgi-script .alfa`; dead here twice over,
    #      since mod_cgi is not even loaded.
    #   3. FilesMatch denies the extensions outright, so a shell is not disclosed
    #      as source either.
    #
    # SPIP's own htaccess.txt already denies .php under local/ and IMG/. The rules
    # below are the belt to that braces, and additionally cover .alfa, .pl, .py
    # and friends, which the upstream rule does not.
    #
    # These MUST be <Directory>, not <DirectoryMatch>. Apache's symlink check
    # ignores Options set in a <DirectoryMatch> section — verified the hard way: a
    # symlink from IMG/ to /etc/passwd was served with a 200 under DirectoryMatch
    # and is correctly refused (AH00037) under Directory. Everything else in the
    # block behaves identically, so the bug is silent.
    #
    # Options is written WITHOUT +/- prefixes, also on purpose: prefixed Options
    # merge with the parent's set, which would leave the webroot's +FollowSymLinks
    # in force here. An absolute Options replaces the inherited set outright.
    #
    # SymLinksIfOwnerMatch rather than no symlink option at all, because
    # mod_rewrite refuses to run without one of the two (AH00670) and SPIP's
    # rewrite rules must still apply or legitimate uploads 403. It refuses any
    # symlink whose target has a different owner, so an attacker-created link to
    # a root-owned file — /var/spip/secrets/connect.php, say — is not followed.

    <Directory /var/www/spip/IMG>
        AllowOverride None
        Options SymLinksIfOwnerMatch
        Require all granted

        php_admin_flag engine off

        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar .cgi .pl .py .sh
        RemoveType    .php .phtml .php3 .php4 .php5 .php7 .php8 .phar

        <FilesMatch "\.(php[0-9]?|phtml|phar|phps|inc|alfa|cgi|pl|py|sh|lua)$">
            Require all denied
        </FilesMatch>

        # Uploaded documents are served inert. SPIP's own htaccess.txt sets this
        # too, so unset first — otherwise the response carries two identical CSP
        # headers. Identical policies intersect to the same thing and it is
        # harmless, but it is confusing to debug. We keep our own rather than
        # relying on SPIP's, because this one is a control we want to own.
        # Both unsets are needed: `Header unset` clears the onsuccess table, where
        # SPIP's `Header add` lands, and `Header always unset` clears the error
        # table. Clearing only one leaves the response carrying two copies.
        Header unset Content-Security-Policy
        Header always unset Content-Security-Policy
        Header always set Content-Security-Policy "sandbox"
        Header always set X-Content-Type-Options "nosniff"
    </Directory>

    <Directory /var/www/spip/local>
        AllowOverride None
        Options SymLinksIfOwnerMatch
        Require all granted

        php_admin_flag engine off

        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar .cgi .pl .py .sh
        RemoveType    .php .phtml .php3 .php4 .php5 .php7 .php8 .phar

        <FilesMatch "\.(php[0-9]?|phtml|phar|phps|inc|alfa|cgi|pl|py|sh|lua)$">
            Require all denied
        </FilesMatch>

        Header always set X-Content-Type-Options "nosniff"
    </Directory>

    # -----------------------------------------------------------------------
    # Secrets and metadata
    # -----------------------------------------------------------------------
    # connect.php and cles.php live outside the webroot entirely (see _DIR_CONNECT
    # and _DIR_ETC in config/mes_options.php). config/ is denied regardless.
    # DirectoryMatch is fine here: no Options, only an authz decision.
    <DirectoryMatch "^/var/www/spip/(config|ecrire/data)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(composer\.(json|lock|phar)|package(-lock)?\.json|phpcs\.xml.*|.*\.md)$">
        Require all denied
    </FilesMatch>

    # Deleted at build time; denied anyway so a botched image cannot expose them.
    <FilesMatch "^(spip_loader\.php|spip_loader_list\.json)$">
        Require all denied
    </FilesMatch>

    # -----------------------------------------------------------------------
    # Reject the exploit's encoding-bypass header
    # -----------------------------------------------------------------------
    # CVE-2026-77806 was triggered with `X-Spip-Filtre: html_entity_decode` on the
    # request. 4.4.21 fixes it properly; this is an independent backstop that costs
    # nothing, because SPIP only ever *sets* this header on responses and never
    # reads it from a request. Rejecting rather than stripping means a scanning
    # wave shows up in the access log instead of as silence.
    <If "-n req('X-Spip-Filtre')">
        Require all denied
    </If>

    # -----------------------------------------------------------------------
    # Private area
    # -----------------------------------------------------------------------
    # /ecrire/ is the back office. Four accounts use it. Restricting it to known
    # networks removes the whole authenticated attack surface from the internet.
    # Note the front proxy's address is the client here unless mod_remoteip is
    # configured — see README §Before first deploy.
    #
    # <Directory /var/www/spip/ecrire>
    #     Require ip 192.0.2.0/24
    # </Directory>
</VirtualHost>
