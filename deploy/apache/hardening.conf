# Server-wide Apache hardening. Loaded as conf-available/zz-hardening.conf so it
# is read after the stock configuration and wins.

# Set globally to suppress AH00558 at startup. The real hostname is whatever the
# front proxy sends; SPIP reads it from the Host header, and UseCanonicalName Off
# in the vhost keeps Apache from rewriting it.
ServerName monel.local

# Do not advertise the Apache or PHP version to scanners. SPIP's own version
# header is suppressed separately via _HEADER_COMPOSED_BY in mes_options.php.
ServerTokens Prod
ServerSignature Off

# TRACE is never needed and enables cross-site tracing.
TraceEnable Off

# Do not follow symlinks anywhere by default. The webroot re-enables
# +FollowSymLinks because SPIP's plugin layout uses them; the writable volumes
# explicitly do not.
<Directory />
    Options -Indexes -Includes -ExecCGI -FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

# Slowloris and request-smuggling hygiene.
Timeout 60
KeepAliveTimeout 5
LimitRequestBody 12582912
LimitRequestFields 100
LimitRequestFieldSize 8190

# The front proxy terminates TLS, so the security headers that describe the
# public origin belong there — HSTS in particular is meaningless on a plain-HTTP
# backend. These are the ones that are safe and useful to set from the origin.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
