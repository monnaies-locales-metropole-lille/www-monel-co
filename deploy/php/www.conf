; PHP-FPM pool for www.monel.co
;
; Overrides the base image's [www] pool (loaded as zz-www.conf, last wins).

[www]
user = spip
group = spip

listen = 0.0.0.0:9000

; FastCGI is an unauthenticated protocol that grants code execution to anyone who
; can reach it, so port 9000 must never be published to the host. It is reachable
; only on the internal compose network, and only from the nginx container's fixed
; address — hence the static IPs in compose.yaml. php-fpm matches exact addresses
; here, not CIDR ranges, so this value and compose.yaml must be kept in step.
listen.allowed_clients = 172.28.0.10

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Kill runaway requests rather than letting them pile up.
request_terminate_timeout = 60s

; Log slow requests with a stack trace — useful for spotting a template that has
; started recompiling on every hit.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

catch_workers_output = yes
decorate_workers_output = no

; ---------------------------------------------------------------------------
; Environment passed to workers
; ---------------------------------------------------------------------------
; php-fpm clears the environment for worker processes by default, so getenv() in
; config/mes_options.php would see nothing. The official php:fpm image happens to
; ship docker.conf with `clear_env = no`, which would make this work by accident —
; and would silently stop working on a base-image change, with the symptom being
; that runtime settings quietly revert to their compiled-in defaults.
;
; So: clear it explicitly, then allowlist exactly the variables the site reads.
; This is also tighter than `clear_env = no`, which would expose every variable in
; the container environment to PHP (and therefore to phpinfo()).
;
; Adding a new runtime setting means adding it here as well as in mes_options.php.
clear_env = yes

env[MONEL_BAZAAR_VIDEO_ID] = $MONEL_BAZAAR_VIDEO_ID

; Unset in production — the Cyclos integration is unreleased work on the
; `cyclos-api` branch. Declared so that branch works by setting variables rather
; than by editing the image.
env[CYCLOS_API_URL] = $CYCLOS_API_URL
env[CYCLOS_ACCESS_TOKEN] = $CYCLOS_ACCESS_TOKEN
env[CYCLOS_CACHE_DURATION] = $CYCLOS_CACHE_DURATION
env[CYCLOS_PAGE_SIZE] = $CYCLOS_PAGE_SIZE
env[CYCLOS_USER_GROUP] = $CYCLOS_USER_GROUP

; Do not let the pool re-enable anything the ini disabled.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,proc_nice,proc_get_status,proc_terminate,pcntl_exec,dl,putenv
php_admin_value[open_basedir] = /var/www/spip:/var/spip/tmp:/var/spip/secrets:/tmp
php_admin_flag[allow_url_include] = off
php_admin_flag[allow_url_fopen] = off

; SPIP is the only thing this pool ever serves. Refuse to execute anything else,
; which neutralises a dropped .php file even if one somehow reached a writable path.
security.limit_extensions = .php
