; PHP hardening for www.monel.co
;
; Loaded last (zz- prefix) so these win over the base image defaults.

; ---------------------------------------------------------------------------
; Command execution
; ---------------------------------------------------------------------------
; The 2026-08-21 dropper enumerated system/passthru/exec/shell_exec/popen and
; used the first one available. SPIP core uses gd for image work and sockets for
; mail, so it needs none of these.
;
; proc_open is included: the recovered Checkpoint-401 shell used it as one of six
; execution paths, and the ALFA CGI channel shows why a PHP-only view is not enough
; (see nginx/monel.conf for the CGI handler counterpart).
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,proc_nice,proc_get_status,proc_terminate,pcntl_exec,dl,putenv

; putenv is disabled above specifically to break the LD_PRELOAD disable_functions
; bypass found in stats-mailer.php. If a plugin turns out to need putenv, remove it
; from this list rather than removing the whole line, and say so here.
;
; Verified against the pinned plugin set — three exec call sites exist and none is
; on a default code path:
;   * ecrire/inc/filtres_images_lib_mini.php  -> only when image processing is set to
;     convert/netpbm. It must stay on GD (the default). Check in the back office under
;     Configuration > Fonctions avancées > Traitement des images.
;   * scssphp/inc/scssphp_compiler.php        -> only when _SCSSPHP_SPIP_CLI_COMPILE is
;     defined (an xdebug workaround). Do not define it. The inline compiler is default.
;   * facteur PHPMailer popen($sendmail)      -> only for the sendmail/qmail transports.
;     facteur must be configured for SMTP, which is what the container wants anyway.
; bootstrap4 and facteur also ship spip-cli commands that shell out; those are CLI-only
; and never reachable over HTTP.

; ---------------------------------------------------------------------------
; Filesystem
; ---------------------------------------------------------------------------
; PHP cannot read or write outside these roots even if it is running attacker code.
; Note /var/spip/secrets is included: connect.php and cles.php live there.
open_basedir = /var/www/spip:/var/spip/tmp:/var/spip/secrets:/tmp

; Remote code loading. allow_url_include is off by default in modern PHP; state it
; anyway so a base-image change cannot silently re-enable it.
;
; allow_url_fopen = Off blocks file_get_contents('https://...'). SPIP core fetches
; remote content through inc/distant.php (sockets/curl), so core and the pinned plugins
; are unaffected — nothing in production needs this on.
;
; The unreleased Cyclos integration on the `cyclos-api` branch does make outbound HTTP
; calls. It must use SPIP's recuperer_url(); written with file_get_contents() it will
; fail here, and the fix belongs on that branch, not in this file.
allow_url_fopen = Off
allow_url_include = Off

; ---------------------------------------------------------------------------
; Information disclosure
; ---------------------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ---------------------------------------------------------------------------
; Sessions and cookies
; ---------------------------------------------------------------------------
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; ---------------------------------------------------------------------------
; Uploads
; ---------------------------------------------------------------------------
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20
upload_tmp_dir = /var/spip/tmp

; ---------------------------------------------------------------------------
; Limits
; ---------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
max_input_vars = 2000

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------
; validate_timestamps=0 is safe *because* the code is immutable: the webroot never
; changes within the life of a container. It also means that if an attacker did
; somehow write a .php file, it would not be picked up for already-cached paths.
;
; SPIP's compiled skeletons under _DIR_TMP are a separate matter — they are meant to
; change, so they must not be excluded from revalidation. SPIP includes them by
; absolute path and busts its own cache, but opcache would hold a stale copy with
; timestamps off. Hence the blacklist below.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.blacklist_filename = /usr/local/etc/php/opcache-blacklist.txt
