# www.monel.co — production compose
#
#   MONEL_IMAGE=ghcr.io/monnaies-locales-metropole-lille/monel-spip:3.8 \
#     docker compose -f deploy/compose.yaml up -d
#
# Two containers, and no host footprint beyond the front proxy and a dump cron:
#   web  Apache + mod_php serving SPIP
#   db   MariaDB, reachable only from web
#
# Deliberate properties:
#   * both read_only, non-root, every capability dropped
#   * only web is published, and only to localhost — the host's Apache terminates
#     TLS and reverse-proxies here
#   * db sits on an `internal: true` network: it has no route off the host and no
#     published port, so nothing outside this stack can reach it. That is the §5.1
#     lesson applied in the direction the incident report did not cover.
#   * no volume grants access to anything outside this site
#
# The point of making the site self-contained is report recommendation #9 —
# separating it from Cyclos. With the database in here, moving this site to its own
# VM is a copy of this file plus two volumes, not a rebuild.
#
# What this file cannot do is perform that separation for you. Run it on a machine
# that has no Cyclos data on it — see README §What this does not fix.

name: monel-spip

services:
  web:
    image: ${MONEL_IMAGE:?set MONEL_IMAGE, e.g. ghcr.io/.../monel-spip:3.8}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    # The image is already root-owned and mode 0555 throughout; this makes the
    # whole filesystem immutable regardless, so `docker diff` on a running
    # container is a genuine integrity check.
    read_only: true

    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    tmpfs:
      # Apache's runtime state. noexec means nothing written here can run.
      - /var/run/apache2:rw,noexec,nosuid,nodev,size=8m
      - /var/lock/apache2:rw,noexec,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    volumes:
      - spip_img:/var/www/spip/IMG
      - spip_local:/var/www/spip/local
      - spip_tmp:/var/spip/tmp
      # connect.php and cles.php. Read-only, outside the webroot, never in the image.
      - ./secrets:/var/spip/secrets:ro

    environment:
      MONEL_BAZAAR_VIDEO_ID: ${MONEL_BAZAAR_VIDEO_ID:-50}
      # Cyclos: unset in production. The integration is on the `cyclos-api`
      # branch and not deployed, so these are optional by design — mes_options.php
      # skips the whole block when they are absent. Do not make them required.
      #
      # Note: with mod_php, getenv() sees the entire container environment — there
      # is no php-fpm env allowlist to hide behind. Keep this list minimal and put
      # nothing here that PHP should not be able to read. The database credentials
      # are deliberately not here; they live in the mounted connect.php.
      CYCLOS_API_URL: ${CYCLOS_API_URL:-}
      CYCLOS_ACCESS_TOKEN: ${CYCLOS_ACCESS_TOKEN:-}
      CYCLOS_CACHE_DURATION: ${CYCLOS_CACHE_DURATION:-900}
      CYCLOS_PAGE_SIZE: ${CYCLOS_PAGE_SIZE:-40}
      CYCLOS_USER_GROUP: ${CYCLOS_USER_GROUP:-members}

    # Bind to localhost only. TLS terminates in the host's Apache in front of this.
    ports:
      - "127.0.0.1:${MONEL_PORT:-8090}:8080"

    networks: [edge, internal]

    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  db:
    image: mariadb:11.4
    restart: unless-stopped

    read_only: true

    cap_drop: [ALL]
    # MariaDB's entrypoint starts as root to fix datadir ownership, then drops to
    # the mysql user. It needs exactly these to do that and nothing more.
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /run/mysqld:rw,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    volumes:
      - db_data:/var/lib/mysql

    environment:
      # The root account gets a random password nobody ever needs: the application
      # user below is created by the entrypoint, and backups run as that user
      # (it holds ALL on its own schema, which covers SELECT and LOCK TABLES).
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${MONEL_DB_NAME:-monel}
      MARIADB_USER: ${MONEL_DB_USER:-monel}
      MARIADB_PASSWORD: ${MONEL_DB_PASSWORD:?set MONEL_DB_PASSWORD — rotated, not the pre-incident value}
      MARIADB_AUTO_UPGRADE: "1"

    # No `ports:`. Ever. The only route to this database is the internal network.

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks: [internal]

    logging: *logging

networks:
  # web only. Carries outbound traffic (SMTP) and the published port.
  edge:

  # web + db. `internal: true` means Docker installs no gateway, so nothing on
  # this network can reach — or be reached from — anything off the host.
  internal:
    internal: true

volumes:
  spip_img:
  spip_local:
  spip_tmp:
  db_data:
